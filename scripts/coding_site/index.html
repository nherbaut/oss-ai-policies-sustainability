<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coding Explorer · AI Policies and Sustainability</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./data.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="masthead">
    <p class="eyebrow">OSS · AI Policies · Sustainability</p>
    <h1>Coding Explorer</h1>
    <p id="summary" role="status"></p>
  </header>
  <main>
    <aside class="sidebar" aria-label="Browse the corpus">
      <section class="filters">
        <h2>Browse the corpus</h2>
        <label for="search">Search documents and text</label>
        <input id="search" type="search" placeholder="Project, file or phrase…">
        <label for="coder">Coder</label>
        <select id="coder"><option value="">All coders</option></select>
        <label class="check"><input id="coded-only" type="checkbox"> Coded documents only</label>
        <button id="reset" type="button">Reset filters</button>
      </section>
      <section>
        <h2>Codes <span id="code-filter"></span></h2>
        <button id="all-codes" type="button" aria-pressed="true">All codes</button>
        <div id="code-tree"></div>
      </section>
      <section>
        <h2>Documents <span id="document-count"></span></h2>
        <div id="documents" class="document-list"></div>
      </section>
    </aside>
    <article id="viewer" aria-label="Selected document">
      <div id="empty" class="empty">Select a document to view its coding.</div>
      <div id="document-view" hidden>
        <header class="document-header">
          <p id="entity" class="eyebrow"></p>
          <h2 id="document-title"></h2>
          <p id="document-info" class="hint"></p>
          <details id="provenance"><summary>Document provenance and memo</summary><pre id="document-memo"></pre></details>
        </header>
        <nav class="tabs" aria-label="Document views">
          <a href="#document-text">Highlighted text</a>
          <a href="#passage-list">Passage details</a>
        </nav>
        <div id="document-text" class="source-text" tabindex="0"></div>
        <section id="passage-list"><h3>Passages and annotations</h3><div id="passages"></div></section>
      </div>
    </article>
  </main>
  <noscript>Enable JavaScript to browse the coding.</noscript>
</body>
</html>
